schemaVersion: "2"
kind: mixin
name: sbx-agents
displayName: sbx-agents
description: ship a user AGENTS.md alongside the sbx-generated profile so opencode loads both

setup:
  install:
    - description: Bridge the host ~/.agents and ~/.config/opencode mounts into the sandbox user's HOME as live symlinks (skills, config, rules), and write the kit AGENTS.md to a distinct ancestor of the workspace so opencode loads it in addition to the sbx profile
      command: |
        set -eu

        ws="${WORKSPACE_DIR:-$(findmnt -n -o TARGET -t virtiofs 2>/dev/null | head -n1)}"
        parent="$(dirname "$ws")"

        # Host home roots: macOS (/Users/<user>) and Linux (/home/<user>). The
        # ~/.agents:ro and ~/.config/opencode:ro mounts land at this mirrored path.
        home=""
        case "$ws" in
          /Users/*|/home/*)
            home="$(printf '%s' "$ws" | cut -d/ -f1-3)"
            ;;
        esac

        # Symlink bridge: opencode resolves global skills via $HOME/.agents/skills and
        # global rules/config via $HOME/.config/opencode, but the mounts land at the
        # host-mirrored $home, not $HOME (/home/agent). Symlink each entry through so
        # they are live and single-sourced, while $HOME itself stays writable.
        if [ -n "$home" ]; then
          mkdir -p /home/agent/.agents /home/agent/.config/opencode
          chown agent:agent /home/agent/.agents /home/agent/.config/opencode

          for entry in "$home"/.agents/* "$home"/.agents/.[!.]*; do
            [ -e "$entry" ] || continue
            ln -sfn "$entry" "/home/agent/.agents/$(basename "$entry")"
          done
          for entry in "$home"/.config/opencode/* "$home"/.config/opencode/.[!.]*; do
            [ -e "$entry" ] || continue
            ln -sfn "$entry" "/home/agent/.config/opencode/$(basename "$entry")"
          done
        fi

        # AGENTS.md: write the user file to a distinct ancestor of the workspace so
        # opencode's upward rule-walk loads it in addition to the sbx profile.
        dest=""
        if [ -n "$home" ] && [ "$home" != "$parent" ]; then
          # Prefer the host home ONLY when it is a distinct ancestor. In the
          # "real layout" (project directly under home) the home AGENTS.md is the
          # sbx profile path itself, which an install-time write cannot survive.
          dest="$home/AGENTS.md"
        fi
        if [ -z "$dest" ]; then
          # Fallback: the workspace grandparent. Always distinct from the profile
          # path (the parent); machine-level for the real layout, but still loaded
          # because opencode's rule walk reaches the filesystem root.
          dest="$(dirname "$parent")/AGENTS.md"
        fi

        # Source resolution: prefer the live host file via the ~/.agents:ro
        # mount (mirrors the host home path in the sandbox), else the kit copy.
        src="${home:+$home/.agents/AGENTS.md}"
        if [ -z "${home:-}" ] || [ ! -f "$src" ]; then
          src="/home/agent/.agents/AGENTS.md"
        fi
        if [ ! -f "$src" ]; then
          echo "sbx-agents: no AGENTS.md source (host mount or kit copy); skipping" >&2
          exit 0
        fi

        install -o agent -g agent -m 0644 "$src" "$dest"
        echo "sbx-agents: wrote $dest from $src"